[project]
name = "tib"
version = "0.1.0"
description = "Which inductive biases matter at small n? Trees, MLPs and TabPFN on tabular data."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "xgboost>=2.0",
  "openml>=0.14",
  "pyyaml>=6.0",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
tabpfn = ["tabpfn>=2.0"]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
