# Experiment 1: how does training size change which inductive biases matter?
# Grinsztajn's three diagnostics x training size x model.
name: nsweep
experiment: nsweep
seed: 0
repeats: 10            # paired subsamples per (dataset, n)
n_test: 2000
train_sizes: [100, 300, 1000, 3000]
models: [rf, xgb, mlp, tabpfn]
device: mps            # Apple GPU: ~5x faster TabPFN at n = 3000. Use "cpu" elsewhere; keep one device per results file.
max_n_per_model: {}    # e.g. {tabpfn: 3000} to cap expensive models
datasets:
  # Week 1 pick: 8 datasets from the Grinsztajn clf-num suite, chosen so every
  # dataset has enough rows for n = 3000 plus the test set (wine and phoneme
  # do not) and d stays small enough for TabPFN with added noise features
  # (Bioresponse, d = 419, does not). Check the names against
  # `python scripts/list_datasets.py` (the runner warns about names it can't find).
  - suite: 337
    names: [heloc, eye_movements, pol, bank-marketing,
            MagicTelescope, house_16H, credit, electricity]
perturbations:
  smooth_lengthscales: [0.2, 0.4, 0.8]    # bandwidth as a fraction of median pairwise distance
  add_noise_fracs: [0.5, 1.0]             # added noise features, as a fraction of d
  drop_fracs: [0.25, 0.5]                 # least-important features removed
  rotate: true
