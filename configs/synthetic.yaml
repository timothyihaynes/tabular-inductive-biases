# Experiment 3: 2x2 {smooth, jumpy} x {axis-aligned, oblique}, across n.
name: synthetic
experiment: synthetic
seed: 0
n_functions: 10        # ground-truth functions per cell (replication unit). 10, not 5: with 5 the smallest Wilcoxon p is 0.0625 (docs/analysis_plan.md)
repeats: 3
pool_size: 5000
n_test: 2000
train_sizes: [100, 300, 1000, 3000]
models: [rf, xgb, mlp, tabpfn]
device: mps            # Apple GPU: ~5x faster TabPFN at n = 3000. Use "cpu" elsewhere; keep one device per results file.
synthetic: {d: 10, k_informative: 3, temperature: 0.25}
